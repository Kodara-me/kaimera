# On a version tag, checks that the tag matches the CMake project version, builds and tests
# the tagged source, then attaches the source archive, the get-kaimera.sh installer and their
# checksums to a draft release, which the maintainer publishes.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Test and draft the release
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Install dependencies
        # The layout tests measure text: without a font the container falls back to wide glyphs.
        run: |
          pacman -Syu --noconfirm --needed \
            git cmake ninja qt6-base qt6-websockets qt6-svg qt6-tools libarchive noto-fonts github-cli

      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check the version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version="${TAG#v}"
          project=$(sed -n 's/^project(Kaimera VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "$version" != "$project" ]; then
            echo "::error::tag $TAG does not match project version $project in CMakeLists.txt"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Source archive, installer and checksums
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="kaimera-$VERSION/" -o "dist/kaimera-$VERSION.tar.gz" "$TAG"
          # The one-command installer, served by releases/latest/download/.
          cp scripts/get-kaimera.sh dist/
          cd dist
          sha256sum kaimera-* get-kaimera.sh > SHA256SUMS
          cat SHA256SUMS

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/release-notes/$VERSION.md"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          elif [ -f "$notes" ]; then
            gh release create "$TAG" dist/* --draft --title "Kaimera $VERSION" --notes-file "$notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --draft --title "Kaimera $VERSION" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
